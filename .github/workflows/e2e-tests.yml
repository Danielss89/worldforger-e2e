name: E2E Tests

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      client_url:
        description: 'Client URL to test against'
        required: false
        default: 'https://worldforger.app'
      api_url:
        description: 'API URL to test against'
        required: false
        default: 'https://api.worldforger.app'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIENT_URL: ${{ github.event.inputs.client_url || 'https://worldforger.app' }}
  API_URL: ${{ github.event.inputs.api_url || 'https://api.worldforger.app' }}

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: npm run test:ci
        env:
          CLIENT_URL: ${{ env.CLIENT_URL }}
          API_URL: ${{ env.API_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  report-to-pr:
    name: Report Results
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Create PR comment with results
        uses: actions/github-script@v7
        env:
          CLIENT_URL_VALUE: ${{ env.CLIENT_URL }}
          API_URL_VALUE: ${{ env.API_URL }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');

            let results = { passed: 0, failed: 0, skipped: 0, duration: 0 };
            const resultsPath = 'test-results/results.json';

            if (fs.existsSync(resultsPath)) {
              const data = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const suites = data.suites || [];

              const countTests = (suite) => {
                let passed = 0, failed = 0, skipped = 0, duration = 0;

                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    duration += test.results?.[0]?.duration || 0;
                    const status = test.results?.[0]?.status;
                    if (status === 'passed') passed++;
                    else if (status === 'failed' || status === 'timedOut') failed++;
                    else if (status === 'skipped') skipped++;
                  }
                }

                for (const child of suite.suites || []) {
                  const childResults = countTests(child);
                  passed += childResults.passed;
                  failed += childResults.failed;
                  skipped += childResults.skipped;
                  duration += childResults.duration;
                }

                return { passed, failed, skipped, duration };
              };

              for (const suite of suites) {
                const suiteResults = countTests(suite);
                results.passed += suiteResults.passed;
                results.failed += suiteResults.failed;
                results.skipped += suiteResults.skipped;
                results.duration += suiteResults.duration;
              }
            }

            const emoji = results.failed > 0 ? '❌' : '✅';
            const total = results.passed + results.failed + results.skipped;
            const durationSec = (results.duration / 1000).toFixed(1);
            const clientUrl = process.env.CLIENT_URL_VALUE;
            const apiUrl = process.env.API_URL_VALUE;
            const runId = process.env.RUN_ID;

            const body = `## ${emoji} E2E Test Results

            | Metric | Value |
            |--------|-------|
            | Total Tests | ${total} |
            | Passed | ✅ ${results.passed} |
            | Failed | ❌ ${results.failed} |
            | Skipped | ⏭️ ${results.skipped} |
            | Duration | ⏱️ ${durationSec}s |

            **Test Environment:**
            - Client: \`${clientUrl}\`
            - API: \`${apiUrl}\`

            [View Full Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('E2E Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  notify-on-tag:
    name: Tag Notification
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Update commit status for tag
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');

            let results = { passed: 0, failed: 0 };
            const resultsPath = 'test-results/results.json';

            if (fs.existsSync(resultsPath)) {
              const data = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));

              const countTests = (suite) => {
                let passed = 0, failed = 0;
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    const status = test.results?.[0]?.status;
                    if (status === 'passed') passed++;
                    else if (status === 'failed' || status === 'timedOut') failed++;
                  }
                }
                for (const child of suite.suites || []) {
                  const childResults = countTests(child);
                  passed += childResults.passed;
                  failed += childResults.failed;
                }
                return { passed, failed };
              };

              for (const suite of data.suites || []) {
                const suiteResults = countTests(suite);
                results.passed += suiteResults.passed;
                results.failed += suiteResults.failed;
              }
            }

            const runId = process.env.RUN_ID;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: results.failed > 0 ? 'failure' : 'success',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`,
              description: `E2E: ${results.passed} passed, ${results.failed} failed`,
              context: 'E2E Tests',
            });
